name: Reusable Android APK Build

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "29.0.13599879"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "36"
  BUILD_TOOLS_VERSION: "36.0.0"
  CI_ANDROID_ABIS: "arm64-v8a,armeabi-v7a,x86_64"
  CI_VCPKG_TRIPLET: "arm64-android"
  LUAJIT_COMMIT: "d0e88930ddde28ff662503f9f20facf34f7265aa"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_FEATURE_FLAGS: versions,binarycaching

concurrency:
  group: otclient-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      # setup-android@v3 installs "tools platform-tools" by default.
      # The legacy "tools" package no longer exists in the SDK repository,
      # which makes sdkmanager exit 1 ("Failed to find package 'tools'").
      # Only install platform-tools here; the rest is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install host build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            g++-multilib \
            gcc-multilib \
            git \
            make \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            zip

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error title=Missing Android SDK::ANDROID_SDK_ROOT or ANDROID_HOME must be set."
            exit 1
          fi

          sdkmanager --sdk_root="$sdk_root" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ndk_dir="$sdk_root/ndk/${NDK_VERSION}"
          if [[ ! -d "$ndk_dir" ]]; then
            ndk_dir="$(find "$sdk_root/ndk" -maxdepth 1 -type d -name "${NDK_VERSION}*" | sort | head -n 1)"
          fi
          if [[ -z "$ndk_dir" || ! -d "$ndk_dir" ]]; then
            echo "::error title=Missing Android NDK::NDK ${NDK_VERSION} was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "ANDROID_NDK_ROOT=$ndk_dir"
          } >> "$GITHUB_ENV"

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid vcpkg baseline::vcpkg.json must contain a full 40-character builtin-baseline SHA."
            exit 1
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ ! -d "${VCPKG_ROOT}/.git" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          git -C "${VCPKG_ROOT}" fetch --depth 1 origin "${{ steps.vcpkg.outputs.baseline }}"
          git -C "${VCPKG_ROOT}" checkout "${{ steps.vcpkg.outputs.baseline }}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Export vcpkg GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Cache LuaJIT Android libraries
        id: luajit-cache
        uses: actions/cache@v4
        with:
          path: |
            luajit-src
            android/app/libs
          key: luajit-android-${{ runner.os }}-${{ env.CI_ANDROID_ABIS }}-ndk-${{ env.NDK_VERSION }}-${{ env.LUAJIT_COMMIT }}-${{ hashFiles('build_luajit_android.sh') }}

      - name: Fetch LuaJIT source
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout "${LUAJIT_COMMIT}"

      - name: Build LuaJIT for Android
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        env:
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
        run: |
          set -euo pipefail
          chmod +x build_luajit_android.sh
          ./build_luajit_android.sh

      - name: Download and verify KingsOt client 15.25 assets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kingsot-client-15.25.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/dudantas/tibia-client/releases/download/15.25.0a00a0/tibia-client-15.25.0a00a0.zip"
          echo "264361a161a7f7261fa08c4c3558939d209ae0cf14c860d456a4b90d4c49c943  $archive" | sha256sum --check --status
          mkdir -p data/things/1525 data/sounds/1525 "$RUNNER_TEMP/kingsot-assets"
          unzip -q "$archive" 'assets/*' 'assets.json' 'assets.json.sha256' 'sounds/*' -d "$RUNNER_TEMP/kingsot-assets"
          cp -a "$RUNNER_TEMP/kingsot-assets/assets/." data/things/1525/
          cp -a "$RUNNER_TEMP/kingsot-assets/sounds/." data/sounds/1525/
          cp "$RUNNER_TEMP/kingsot-assets/assets.json" "$RUNNER_TEMP/kingsot-assets/assets.json.sha256" data/things/1525/
          test -s data/things/1525/assets.json.sha256

      - name: Pack game assets into data.zip
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path('android/app/src/main/assets/data.zip')
          roots = [Path('data'), Path('mods'), Path('modules')]
          files = [Path('init.lua'), Path('otclientrc.lua'), Path('cacert.pem'), Path('config.ini')]

          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  if not root.exists():
                      raise SystemExit(f'Missing asset directory: {root}')
                  for path in sorted(root.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.as_posix())
              for path in files:
                  if path.exists():
                      archive.write(path, path.as_posix())

          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --info

      - name: Verify APK metadata, signing, and 16 KB alignment
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt2 dump badging "$apk" | grep -E "^(sdkVersion|targetSdkVersion|native-code:)"
          aapt2 dump badging "$apk" | grep -q "sdkVersion:'24'"
          aapt2 dump badging "$apk" | grep -q "targetSdkVersion:'36'"
          aapt2 dump badging "$apk" | grep -q "arm64-v8a"
          aapt2 dump badging "$apk" | grep -q "armeabi-v7a"
          aapt2 dump badging "$apk" | grep -q "x86_64"
          zipalign -c -P 16 -v 4 "$apk"
          apksigner verify --verbose "$apk"

      - name: Install official Android emulator images
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install emulator \
            "system-images;android-24;google_apis;x86_64" \
            "system-images;android-33;google_apis;x86_64" \
            "system-images;android-36;google_apis;x86_64"

      - name: Install and run APK on Android 7, 13, and 16
        timeout-minutes: 35
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          for api in 24 33 36; do
            name="KingsOt_API_${api}"
            avdmanager create avd --force --name "$name" \
              --package "system-images;android-${api};google_apis;x86_64" \
              --device pixel_2 <<< 'no'
            emulator -avd "$name" -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -memory 2048 -no-snapshot-save \
              >"$RUNNER_TEMP/emulator-${api}.log" 2>&1 &
            emulator_pid=$!
            adb wait-for-device
            booted=false
            for attempt in $(seq 1 60); do
              if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
                booted=true
                break
              fi
              sleep 5
            done
            if [[ "$booted" != true ]]; then
              cat "$RUNNER_TEMP/emulator-${api}.log"
              exit 1
            fi
            adb logcat -c
            adb install -r "$apk"
            adb shell monkey -p com.github.otclient 1
            sleep 300
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Fatal signal'; then
              exit 1
            fi
            adb emu kill
            wait "$emulator_pid" || true
          done

      - name: List APK outputs
        run: find android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write download summary
        run: |
          {
            echo "## Android APK"
            echo ""
            echo "The APK was uploaded as the workflow artifact:"
            echo ""
            echo "- otclient-android-release-${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
